<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Aquarium Control</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#33afff">
    <link rel="icon" type="image/x-icon" href="/favicon.jpg">
    <style>
        body {
            background: #121212;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px 20px 40px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .container {
            background: #1e1e1e;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .switch input {
            display: none;
        }

        .slider {
            position: absolute;
            inset: 0;
            background: #333;
            transition: .4s;
            border-radius: 34px;
            cursor: pointer;
        }

        .slider:before {
            content: "";
            position: absolute;
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background: #2196F3;
        }

        input:checked+.slider:before {
            transform: translateX(26px);
        }

        #status {
            margin: 1rem 0;
            font-size: 1.2rem;
            color: #888;
        }

        .time-controls {
            display: none;
            background: #252525;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
        }

        .time-controls.active {
            display: block;
        }

        .time-input {
            background: #333;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 4px;
            width: 120px;
        }

        .disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .mode-selector {
            background: #252525;
            padding: 4px;
            border-radius: 8px;
            margin: 0.5rem 0;
            display: flex;
            justify-content: center;
        }

        .mode-selector input[type="radio"] {
            display: none;
        }

        .mode-selector label {
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s;
        }

        .mode-selector input[type="radio"]:checked+label {
            background: #2196F3;
            color: white;
        }

        .control-panel {
            display: none;
            margin-top: 1rem;
            background: #252525;
            padding: 1.2rem;
            border-radius: 8px;
        }

        .control-panel.active {
            display: block;
        }

        #timerControl,
        #autoControl {
            background: #252525;
            padding: 1.2rem;
            border-radius: 8px;
            text-align: center;
        }

        #autoControl_1,
        #autoControl_2,
        #autoControl_3,
        #autoControl_4 {
            text-align: center;
        }

        #autoControl_1 div,
        #autoControl_2 div,
        #autoControl_3 div,
        #autoControl_4 div {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        #autoControl_1 label,
        #autoControl_2 label,
        #autoControl_3 label,
        #autoControl_4 label {
            min-width: 80px;
            text-align: right;
        }

        .time-input {
            flex: 0 1 120px;
        }

        #autoControl div,
        #timerControl div {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        select {
            background: #333;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 4px;
            margin: 5px;
            width: 120px;
            margin: 0;
        }

        .btn-set {
            background: #2196F3;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
            margin: 15px auto 0;
            display: block;
        }

        .btn-set:hover {
            background: #1976D2;
        }

        .status-monitor {
            background: #252525;
            padding: 0.8rem;
            border-radius: 8px;
            margin: 0 0 1rem 0;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            background: #666;
        }

        .status-indicator.on {
            background: #4CAF50;
            box-shadow: 0 0 10px #4CAF50;
        }

        .status-indicator.off {
            background: #666;
        }

        .switch-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .switch-label {
            color: #888;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            padding: 0 60px;
            box-sizing: border-box;
        }

        .connection-status {
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 5px;
            position: absolute;
            right: 0;
        }

        .connection-status.online {
            background: #1b5e20;
            color: #4CAF50;
        }

        .connection-status.offline {
            background: #b71c1c;
            color: #ff5252;
        }

        .connection-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .connection-status.online .connection-dot {
            background: #4CAF50;
            box-shadow: 0 0 8px #4CAF50;
        }

        .connection-status.offline .connection-dot {
            background: #ff5252;
            box-shadow: 0 0 8px #ff5252;
        }

        .hidden {
            display: none;
        }

        .page-header {
            background: #1e1e1e;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            margin-bottom: 1rem;
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
            text-align: center;
        }

        .controls-container {
            background: #1e1e1e;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }

        .page-title {
            color: #2196F3;
            font-size: 2rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            flex: 1;
            text-align: center;
        }

        .disable-control {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid #333;
            text-align: center;
        }

        .disable-control .switch-label {
            color: #888;
        }

        .disable-control .switch-label:first-child {
            color: #4CAF50;
            /* Green for ENABLED */
        }

        .disable-control .switch-label:last-child {
            color: #ff5252;
            /* Red for DISABLED */
        }

        .disable-control .slider {
            background: #4CAF50;
            /* Green background for enabled state */
        }

        .disable-control input:checked+.slider {
            background: #b71c1c;
            /* Red background for disabled state */
        }

        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                gap: 1rem;
                padding: 0;
            }

            .connection-status {
                position: static;
                margin-top: 0.5rem;
            }

            .page-title {
                margin-bottom: 0.5rem;
            }
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 900px;
        }

        .controls-container {
            max-width: none;
            margin: 0;
        }

        .led-title {
            color: #2196F3;
            font-size: 1.2rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }

        #timerControl_1,
        #timerControl_2,
        #timerControl_3,
        #timerControl_4 {
            text-align: center;
        }

        #timerControl_1 div,
        #timerControl_2 div,
        #timerControl_3 div,
        #timerControl_4 div {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        #timerControl_1 label,
        #timerControl_2 label,
        #timerControl_3 label,
        #timerControl_4 label {

            text-align: right;
        }

        select {
            flex: 0 1 120px;
            margin: 0;
        }

        .timer-switch-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 1rem auto;
            width: auto;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
            flex: none;
        }

        .switch-label {
            color: #888;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            flex: none;
        }

        /* Timer Control Styles */
        .timer-switch-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 1rem;
        }

        .timer-switch-container .switch {
            width: 60px;
            height: 34px;
            margin: 0;
            flex: none;
        }

        .timer-switch-container .switch-label {
            color: #888;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            flex: none;
            margin: 0;
        }

        .version-footer {
            margin-top: auto;
            width: 100%;
            font-size: 0.7rem;
            color: #666;
            text-align: center;
            background: #121212;
            padding: 8px 0;
            border-top: 1px solid #252525;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .copyright {
            font-size: 0.65rem;
            color: #555;
        }

        .navbar {
            width: 100%;
            max-width: 600px;
            margin-bottom: 1rem;
            display: flex;
            justify-content: center;
            padding: 8px;
            background: #1e1e1e;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
        }

        .temperature-control {
            padding: 1.2rem;
            background: #252525;
            border-radius: 8px;
        }

        .temperature-control>div:not(.temperature-warning) {
            display: grid;
            grid-template-columns: minmax(120px, max-content) minmax(120px, 150px);
            justify-content: center;
            align-items: center;
            gap: 14px;
            margin-bottom: 14px;
        }

        .temperature-control label {
            color: #bdbdbd;
            text-align: center;
        }

        .temperature-control select,
        .temperature-control input {
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
        }

        .temperature-value {
            display: block !important;
            color: #4CAF50;
            text-align: center;
            margin: 18px 0 !important;
        }

        .temperature-warning {
            display: block !important;
            color: #ff5252;
            font-size: 0.8rem;
            line-height: 1.4;
            text-align: center;
            margin: 4px 0 16px !important;
        }

        @media (max-width: 420px) {
            .temperature-control>div:not(.temperature-warning) {
                grid-template-columns: 1fr;
                gap: 6px;
            }

            .temperature-control label {
                text-align: left;
            }
        }

        .rtc-display {
            color: #4CAF50;
            font-size: 1rem;
            text-align: center;
            min-height: 1.2em;
        }

        .nav-btn {
            background: #252525;
            color: #2196F3;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .nav-btn:hover {
            background: #2196F3;
            color: white;
            transform: translateY(-1px);
        }

        /* Timer Animation Styles */
        .timer-animation {
            display: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .timer-animation.active {
            display: block;
            opacity: 1;
        }

        .timer-countdown {
            font-size: 1.2rem;
            color: #2196F3;
            text-align: center;
            margin: 1rem 0;
        }

        .timer-controls {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
            width: 100%;
            transition: opacity 0.3s;
        }

        .timer-controls.hidden {
            opacity: 0;
            pointer-events: none;
            position: absolute;
        }

        .timer-control {
            position: relative;
            min-height: 80px;
        }
    </style>
</head>

<body>
    <div class="page-header">
        <div class="header">
            <h2 class="page-title">Smart Aquarium V4</h2>
            <div id="connectionStatus" class="connection-status offline">
                <span class="connection-dot"></span>
                <span>Offline</span>
            </div>
        </div>
    </div>

    <div id="rtcDisplay" class="rtc-display">RTC Error</div>

    <nav class="navbar">
        <button class="nav-btn" onclick="window.location.href='settings.html'">Settings</button>
    </nav>

    <div id="relayGrid" class="grid-container">
    </div>

    <footer class="version-footer">
        <span id="versionInfo">Checking version...</span>
        <span class="copyright">&copy; 2025 <a href="https://github.com/desiFish/Smart-Aquarium-V4.0">desiFish</a>. All
            rights reserved.</span>
    </footer>

    <script>
        let relayIds = [];

        function generateRelayPanels(relayCount) {
            const grid = document.getElementById('relayGrid');
            grid.innerHTML = '';
            relayIds = Array.from({ length: relayCount }, (_, index) => index + 1);
            relayIds.forEach(ledId => {
                grid.insertAdjacentHTML('beforeend', `
                    <div id="led${ledId}" class="controls-container">
                        <h3 class="led-title" id="ledName_${ledId}">LED ${ledId}</h3>
                        <div class="status-monitor">
                            <span class="status-indicator"></span>
                            <span id="liveStatus_${ledId}">Checking LED status...</span>
                        </div>
                        <div class="mode-selector">
                            <input type="radio" id="modeManual_${ledId}" name="mode_${ledId}" value="manual" checked>
                            <label for="modeManual_${ledId}">Manual</label>
                            <input type="radio" id="modeAuto_${ledId}" name="mode_${ledId}" value="auto">
                            <label for="modeAuto_${ledId}">Auto</label>
                            <input type="radio" id="modeTemperature_${ledId}" name="mode_${ledId}" value="temperature">
                            <label for="modeTemperature_${ledId}">Temperature</label>
                            <input type="radio" id="modeTimer_${ledId}" name="mode_${ledId}" value="timer">
                            <label for="modeTimer_${ledId}">Timer</label>
                        </div>
                        <div id="temperatureControl_${ledId}" class="control-panel temperature-control">
                            <div><label>Sensor:</label><select id="temperatureSensor_${ledId}"><option value="">No sensors found</option></select></div>
                            <div><label>Maintain temperature:</label><input type="number" id="temperatureTarget_${ledId}" class="time-input" step="0.1" min="-55" max="125"></div>
                            <div id="temperatureValue_${ledId}" class="temperature-value">Temperature: --</div>
                            <div class="temperature-warning">Temperature control works only when a heater is connected to this relay.</div>
                            <button id="setTemperature_${ledId}" class="btn-set">Set Temperature Control</button>
                        </div>
                        <div id="manualControl_${ledId}" class="control-panel active">
                            <div class="switch-container"><span class="switch-label">OFF</span><label class="switch"><input type="checkbox" id="ledToggle_${ledId}"><span class="slider"></span></label><span class="switch-label">ON</span></div>
                        </div>
                        <div id="autoControl_${ledId}" class="control-panel">
                            <div><label>ON Time:</label><input type="time" id="onTime_${ledId}" class="time-input"></div>
                            <div><label>OFF Time:</label><input type="time" id="offTime_${ledId}" class="time-input"></div>
                            <button id="setTime_${ledId}" class="btn-set">Set Schedule</button>
                        </div>
                        <div id="timerControl_${ledId}" class="control-panel timer-control">
                            <div class="timer-controls"><label>Timer Duration:</label><select id="timerDuration_${ledId}" onchange="updateTimerToggle(${ledId})"><option value="0">No Timer</option><option value="60">1 minute</option><option value="300">5 minutes</option><option value="600">10 minutes</option><option value="900">15 minutes</option><option value="1800">30 minutes</option><option value="2700">45 minutes</option></select></div>
                            <div id="timerSwitchContainer_${ledId}" class="timer-switch-container"><span class="switch-label">OFF</span><label class="switch"><input type="checkbox" id="timerToggle_${ledId}"><span class="slider"></span></label><span class="switch-label">ON</span></div>
                            <div id="timerAnimation_${ledId}" class="timer-animation"><div id="timerCountdown_${ledId}" class="timer-countdown">00:00</div></div>
                        </div>
                        <div class="disable-control"><div class="switch-container"><span class="switch-label">ENABLED</span><label class="switch"><input type="checkbox" id="disableToggle_${ledId}"><span class="slider"></span></label><span class="switch-label">DISABLED</span></div></div>
                    </div>`);
                ledStates[ledId] = { enabled: false };
                activeTimers[ledId] = null;
            });
        }

        function fetchRelayCount() {
            return fetch(`/api/relay-count?check=${Date.now()}`, { cache: 'no-store' })
                .then(response => {
                    if (!response.ok) throw new Error('Relay count request failed');
                    return response.text();
                })
                .then(value => {
                    const relayCount = Number(value);
                    if (!Number.isInteger(relayCount) || relayCount < 1) throw new Error('Invalid relay count');
                    generateRelayPanels(relayCount);
                })
                .catch(error => {
                    console.error('Error fetching relay count:', error);
                    generateRelayPanels(4);
                });
        }

        // Add this function at the start of the script section
        function fetchLEDNames() {
            relayIds.forEach(ledId => {
                fetch(`/api/led${ledId}/name`)
                    .then(response => {
                        if (!response.ok) throw new Error('Network response was not ok');
                        return response.text();
                    })
                    .then(name => {
                        const nameElement = document.getElementById(`ledName_${ledId}`);
                        nameElement.textContent = name || `LED ${ledId}`;
                    })
                    .catch(error => {
                        console.error('Error fetching LED name:', error);
                        const nameElement = document.getElementById(`ledName_${ledId}`);
                        nameElement.textContent = 'Error';
                    });
            });
        }

        // LED states tracking
        const ledStates = {};

        // function to fetch LED states
        function fetchLEDStates() {
            relayIds.forEach(ledId => {
                fetch(`/api/led${ledId}/system/state`)
                    .then(response => {
                        if (!response.ok) throw new Error('Network response was not ok');
                        return response.json();
                    })
                    .then(state => {
                        ledStates[ledId].enabled = state.enabled;
                        const led = document.getElementById(`led${ledId}`);
                        const disableToggle = document.querySelector(`#disableToggle_${ledId}`);
                        const controls = document.querySelectorAll(`#led${ledId} .control-panel, #led${ledId} .mode-selector`);

                        // Update UI state
                        disableToggle.checked = !state.enabled;
                        controls.forEach(panel => {
                            panel.style.opacity = state.enabled ? '1' : '0.5';
                            panel.style.pointerEvents = state.enabled ? 'auto' : 'none';
                        });

                        // Update status text if disabled
                        if (!state.enabled) {
                            const statusText = document.querySelector(`#liveStatus_${ledId}`);
                            const indicator = document.querySelector(`#led${ledId} .status-indicator`);
                            statusText.textContent = 'Status: Disabled';
                            indicator.className = 'status-indicator off';
                        }
                    })
                    .catch(error => {
                        console.error('Error fetching LED state:', error);
                        // Disable LED on error
                        ledStates[ledId].enabled = false;
                        const disableToggle = document.querySelector(`#disableToggle_${ledId}`);
                        const controls = document.querySelectorAll(`#led${ledId} .control-panel, #led${ledId} .mode-selector`);
                        const statusText = document.querySelector(`#liveStatus_${ledId}`);
                        const indicator = document.querySelector(`#led${ledId} .status-indicator`);

                        disableToggle.checked = true;
                        controls.forEach(panel => {
                            panel.style.opacity = '0.5';
                            panel.style.pointerEvents = 'none';
                        });
                        statusText.textContent = 'Status: Disabled';
                        indicator.className = 'status-indicator off';
                    });
            });
        }

        // Add this function before setupLED
        function syncModesFromServer() {
            relayIds.forEach(ledId => {
                if (!ledStates[ledId].enabled) return;

                fetch(`/api/led${ledId}/mode`)
                    .then(response => {
                        if (!response.ok) throw new Error('Network response was not ok');
                        return response.text();
                    })
                    .then(mode => {
                        // Validate mode
                        const validModes = ['manual', 'auto', 'timer', 'temperature'];
                        mode = mode.toLowerCase().trim();

                        if (!validModes.includes(mode)) return;

                        // Update UI
                        const modeRadio = document.querySelector(`#mode${mode.charAt(0).toUpperCase() + mode.slice(1)}_${ledId}`);
                        const panels = {
                            manual: document.querySelector(`#manualControl_${ledId}`),
                            auto: document.querySelector(`#autoControl_${ledId}`),
                            timer: document.querySelector(`#timerControl_${ledId}`),
                            temperature: document.querySelector(`#temperatureControl_${ledId}`)
                        };

                        if (modeRadio) {
                            // Check radio button
                            modeRadio.checked = true;

                            // Show correct panel
                            Object.values(panels).forEach(panel => {
                                if (panel) panel.classList.remove('active');
                            });
                            if (panels[mode]) panels[mode].classList.add('active');
                        }
                    })
                    .catch(error => console.error(`Error syncing mode for LED ${ledId}:`, error));
            });
        }

        // Add this function after fetchLEDStates
        function initModesFromServer() {
            relayIds.forEach(ledId => {
                fetch(`/api/led${ledId}/mode`)
                    .then(response => {
                        if (!response.ok) throw new Error('Network response was not ok');
                        return response.text();
                    })
                    .then(mode => {
                        mode = mode.toLowerCase().trim();
                        if (!['manual', 'auto', 'timer', 'temperature'].includes(mode)) return;

                        // Select the correct radio button
                        const modeSelector = document.querySelector(`#mode${mode.charAt(0).toUpperCase() + mode.slice(1)}_${ledId}`);
                        if (modeSelector) {
                            modeSelector.checked = true;
                        }

                        // Show the correct panel
                        const panels = document.querySelectorAll(`#led${ledId} .control-panel`);
                        panels.forEach(p => p.classList.remove('active'));
                        document.querySelector(`#${mode}Control_${ledId}`).classList.add('active');

                        // If timer mode, check timer state
                        if (mode === 'timer') {
                            checkTimerState(ledId);
                        }
                    })
                    .catch(error => console.error(`Error loading mode for LED ${ledId}:`, error));
            });
        }

        // Add this function after syncModesFromServer
        function fetchScheduleTimes() {
            relayIds.forEach(ledId => {
                fetch(`/api/led${ledId}/schedule`)
                    .then(response => {
                        if (!response.ok) throw new Error('Network response was not ok');
                        return response.json();
                    })
                    .then(schedule => {
                        const onTimeInput = document.querySelector(`#onTime_${ledId}`);
                        const offTimeInput = document.querySelector(`#offTime_${ledId}`);

                        // Convert integer times back to HH:MM format
                        if (schedule.onTime) {
                            const hours = Math.floor(schedule.onTime / 100).toString().padStart(2, '0');
                            const minutes = (schedule.onTime % 100).toString().padStart(2, '0');
                            onTimeInput.value = `${hours}:${minutes}`;
                        }

                        if (schedule.offTime) {
                            const hours = Math.floor(schedule.offTime / 100).toString().padStart(2, '0');
                            const minutes = (schedule.offTime % 100).toString().padStart(2, '0');
                            offTimeInput.value = `${hours}:${minutes}`;
                        }
                    })
                    .catch(error => console.error(`Error fetching schedule for LED ${ledId}:`, error));
            });
        }

        // active timer tracking
        const activeTimers = {};

        function showTimerAnimation(ledId) {
            const elements = {
                animation: document.querySelector(`#timerAnimation_${ledId}`),
                countdown: document.querySelector(`#timerCountdown_${ledId}`),
                controls: document.querySelector(`#timerControl_${ledId} .timer-controls`),
                switchContainer: document.querySelector(`#timerSwitchContainer_${ledId}`)
            };

            if (activeTimers[ledId]) {
                clearInterval(activeTimers[ledId]);
            }

            // Hide controls and show animation with switch
            elements.controls.style.display = 'none';
            elements.switchContainer.style.display = 'flex';
            elements.animation.classList.add('active');

            function updateTimerDisplay() {
                fetch(`/api/led${ledId}/timer/state`)
                    .then(response => response.json())
                    .then(state => {
                        if (!state.active || !state.remaining) {
                            hideTimerAnimation(ledId);
                            return;
                        }

                        const minutes = Math.floor(state.remaining / 60);
                        const seconds = state.remaining % 60;
                        const nextAction = state.state === 'ON' ? 'Turning OFF' : 'Turning ON';
                        elements.countdown.textContent =
                            `${nextAction} in ${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                    })
                    .catch(() => hideTimerAnimation(ledId));
            }

            updateTimerDisplay();
            activeTimers[ledId] = setInterval(updateTimerDisplay, 1000);
        }

        function hideTimerAnimation(ledId) {
            if (activeTimers[ledId]) {
                clearInterval(activeTimers[ledId]);
                activeTimers[ledId] = null;
            }

            const elements = {
                animation: document.querySelector(`#timerAnimation_${ledId}`),
                controls: document.querySelector(`#timerControl_${ledId} .timer-controls`),
                switchContainer: document.querySelector(`#timerSwitchContainer_${ledId}`),
                countdown: document.querySelector(`#timerCountdown_${ledId}`),
                durationSelect: document.querySelector(`#timerDuration_${ledId}`),
                timerToggle: document.querySelector(`#timerToggle_${ledId}`)
            };

            // Reset all timer controls
            elements.animation.classList.remove('active');
            elements.controls.style.display = 'flex';
            elements.switchContainer.style.display = 'none';
            elements.countdown.textContent = '00:00';
            elements.durationSelect.value = "0";
            elements.timerToggle.checked = false;
        }

        function checkTimerState(ledId) {
            fetch(`/api/led${ledId}/timer/state`)
                .then(response => response.json())
                .then(state => {
                    // If no state or not active, ensure controls are visible and reset
                    if (!state || !state.active) {
                        hideTimerAnimation(ledId);
                        const elements = {
                            controls: document.querySelector(`#timerControl_${ledId} .timer-controls`),
                            switchContainer: document.querySelector(`#timerSwitchContainer_${ledId}`)
                        };
                        elements.controls.classList.remove('hidden');
                        elements.switchContainer.classList.remove('hidden');
                        return;
                    }

                    // Switch to timer mode and show panel
                    const modeSelector = document.querySelector(`#modeTimer_${ledId}`);
                    const timerPanel = document.querySelector(`#timerControl_${ledId}`);

                    modeSelector.checked = true;
                    document.querySelectorAll(`#led${ledId} .control-panel`).forEach(p => p.classList.remove('active'));
                    timerPanel.classList.add('active');

                    // Set duration and toggle
                    const durationSelect = document.querySelector(`#timerDuration_${ledId}`);
                    const timerToggle = document.querySelector(`#timerToggle_${ledId}`);
                    durationSelect.value = state.duration;
                    timerToggle.checked = true;

                    // Show animation without hiding controls initially
                    const elements = {
                        animation: document.querySelector(`#timerAnimation_${ledId}`),
                        countdown: document.querySelector(`#timerCountdown_${ledId}`)
                    };
                    elements.animation.classList.add('active');
                    showTimerAnimation(ledId);
                })
                .catch(error => console.error('Error checking timer state:', error));
        }

        function checkAllTimerStates() {
            relayIds.forEach(ledId => {
                fetch(`/api/led${ledId}/mode`)
                    .then(response => response.text())
                    .then(mode => {
                        if (mode.trim().toLowerCase() === 'timer') {
                            checkTimerState(ledId);
                        }
                    })
                    .catch(error => console.error('Error checking timer mode:', error));
            });
        }

        let availableSensors = [];
        function fetchTemperatureSensors() {
            return fetch('/api/sensors')
                .then(response => response.json())
                .then(result => {
                    availableSensors = result.sensors || [];
                    relayIds.forEach(ledId => {
                        const select = document.querySelector(`#temperatureSensor_${ledId}`);
                        select.innerHTML = '';
                        const placeholder = document.createElement('option');
                        placeholder.value = '';
                        placeholder.textContent = availableSensors.length ? 'Select a sensor' : 'No sensors found';
                        placeholder.selected = true;
                        placeholder.disabled = availableSensors.length > 0;
                        select.appendChild(placeholder);
                        availableSensors.forEach(sensor => {
                            const option = document.createElement('option');
                            option.value = sensor.address;
                            const temperature = typeof sensor.temperature === 'number' ? sensor.temperature : NaN;
                            const reading = Number.isFinite(temperature) ? `${temperature.toFixed(1)}°C` : 'Read error';
                            option.textContent = `Sensor ${sensor.address.slice(-4)} (${reading})`;
                            select.appendChild(option);
                        });
                    });
                })
                .catch(() => {
                    availableSensors = [];
                });
        }

        // Function to initialize LED controls
        function setupLED(ledId) {
            const led = {
                container: document.getElementById(`led${ledId}`),
                modes: document.querySelectorAll(`input[name="mode_${ledId}"]`),
                indicator: document.querySelector(`#led${ledId} .status-indicator`),
                statusText: document.querySelector(`#liveStatus_${ledId}`),
                toggle: document.querySelector(`#ledToggle_${ledId}`),
                panels: {
                    manual: document.querySelector(`#manualControl_${ledId}`),
                    auto: document.querySelector(`#autoControl_${ledId}`),
                    timer: document.querySelector(`#timerControl_${ledId}`),
                    temperature: document.querySelector(`#temperatureControl_${ledId}`)
                },
                disableToggle: document.querySelector(`#disableToggle_${ledId}`),
                allControls: document.querySelectorAll(`#led${ledId} .control-panel, #led${ledId} .mode-selector`),
                timerDuration: document.querySelector(`#timerDuration_${ledId}`),
                timerSwitch: document.querySelector(`#timerSwitchContainer_${ledId}`),
                temperatureSensor: document.querySelector(`#temperatureSensor_${ledId}`),
                temperatureTarget: document.querySelector(`#temperatureTarget_${ledId}`),
                temperatureValue: document.querySelector(`#temperatureValue_${ledId}`)
            };

            fetch(`/api/led${ledId}/temperature`)
                .then(response => response.json())
                .then(settings => {
                    led.temperatureSensor.value = settings.sensor || '';
                    led.temperatureTarget.value = settings.targetTemperature;
                })
                .catch(error => console.error(`Error loading temperature settings for relay ${ledId}:`, error));

            document.querySelector(`#setTemperature_${ledId}`).onclick = () => {
                const sensor = led.temperatureSensor.value;
                const targetTemperature = parseFloat(led.temperatureTarget.value);
                if (!sensor || Number.isNaN(targetTemperature)) {
                    alert('Select a sensor and enter a maintain temperature');
                    return;
                }
                fetch(`/api/led${ledId}/temperature`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sensor, targetTemperature })
                })
                    .then(response => {
                        if (!response.ok) throw new Error('Temperature settings failed');
                        return response.json();
                    })
                    .then(() => {
                        led.modes.forEach(mode => mode.checked = mode.value === 'temperature');
                        Object.values(led.panels).forEach(panel => panel.classList.remove('active'));
                        led.panels.temperature.classList.add('active');
                        alert('Temperature control saved');
                    })
                    .catch(error => {
                        console.error(error);
                        alert('Failed to save temperature control');
                    });
            };

            // Mode selection only updates UI panels
            led.modes.forEach(mode => {
                mode.onclick = () => {
                    if (!ledStates[ledId].enabled) return;

                    // Reset timer state if switching away from timer mode
                    const currentMode = Array.from(led.modes).find(m => m.checked)?.value;
                    if (currentMode === 'timer' && mode.value !== 'timer') {
                        const timerToggle = document.querySelector(`#timerToggle_${ledId}`);
                        timerToggle.checked = false;
                        if (activeTimers[ledId]) {
                            hideTimerAnimation(ledId);
                        }
                    }

                    Object.values(led.panels).forEach(panel => panel.classList.remove('active'));
                    led.panels[mode.value].classList.add('active');
                };
            });

            // Manual mode toggle handler
            led.toggle.onclick = () => {
                if (!ledStates[ledId].enabled) return;
                led.toggle.disabled = true;
                setTimeout(() => {
                    led.toggle.disabled = false;
                }, 1500);

                // Stop any timer animation and clear timer toggle
                if (activeTimers[ledId]) {
                    hideTimerAnimation(ledId);
                    const timerToggle = document.querySelector(`#timerToggle_${ledId}`);
                    timerToggle.checked = false;
                }

                fetch(`/api/led${ledId}/mode`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mode: 'manual' })
                })
                    .then(() => {
                        return fetch(`/api/led${ledId}/toggle`, { method: 'POST' });
                    })
                    .then(() => updateLEDStatus(ledId))
                    .catch(error => console.error('Error:', error));
            };

            // Auto mode schedule handler
            const setTimeBtn = document.querySelector(`#setTime_${ledId}`);
            setTimeBtn.onclick = () => {
                if (!ledStates[ledId].enabled) return;

                const onTime = document.querySelector(`#onTime_${ledId}`).value;
                const offTime = document.querySelector(`#offTime_${ledId}`).value;

                if (!onTime || !offTime) {
                    alert('Please set both ON and OFF times');
                    return;
                }

                fetch(`/api/led${ledId}/mode`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mode: 'auto' })
                })
                    .then(() => {
                        return fetch(`/api/led${ledId}/schedule`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ onTime, offTime })
                        });
                    })
                    .then(() => {
                        alert('Schedule set successfully!');
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert('Failed to set schedule');
                    });
            };

            // Timer mode handler
            const timerToggle = document.querySelector(`#timerToggle_${ledId}`);
            timerToggle.onclick = () => {
                if (!ledStates[ledId].enabled) return;

                // If timer is already running, just stop it
                if (activeTimers[ledId]) {
                    fetch(`/api/led${ledId}/timer`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ duration: 0, state: false })
                    })
                        .then(response => {
                            if (!response.ok) throw new Error('Failed to stop timer');
                            return response.text();
                        })
                        .then(result => {
                            if (result === "Timer stopped") {
                                hideTimerAnimation(ledId);
                                timerToggle.checked = false;
                                // Reset duration dropdown to "No Timer"
                                const durationSelect = document.querySelector(`#timerDuration_${ledId}`);
                                durationSelect.value = "0";
                                // Update switch visibility
                                const switchContainer = document.querySelector(`#timerSwitchContainer_${ledId}`);
                                switchContainer.style.display = 'none';
                            }
                        })
                        .catch(error => {
                            console.error('Error:', error);
                            timerToggle.checked = true;
                        });
                    return;
                }

                // Otherwise start a new timer
                const duration = document.querySelector(`#timerDuration_${ledId}`).value;
                if (duration === "0") {
                    alert('Please select a duration');
                    timerToggle.checked = false;
                    return;
                }

                fetch(`/api/led${ledId}/mode`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mode: 'timer' })
                })
                    .then(() => {
                        return fetch(`/api/led${ledId}/timer`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ duration: parseInt(duration), state: timerToggle.checked })
                        });
                    })
                    .then(response => response.text())
                    .then(result => {
                        if (result === "Timer started") {
                            showTimerAnimation(ledId);
                        } else if (result === "Timer stopped") {
                            hideTimerAnimation(ledId);
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        timerToggle.checked = !timerToggle.checked;
                    });
            };

            // Modify disable toggle handler
            led.disableToggle.onclick = () => {
                ledStates[ledId].enabled = !led.disableToggle.checked;

                // Stop any active timer animation
                if (!ledStates[ledId].enabled && activeTimers[ledId]) {
                    hideTimerAnimation(ledId);
                    const timerToggle = document.querySelector(`#timerToggle_${ledId}`);
                    timerToggle.checked = false;
                }

                // Update UI state
                led.allControls.forEach(panel => {
                    panel.style.opacity = ledStates[ledId].enabled ? '1' : '0.5';
                    panel.style.pointerEvents = ledStates[ledId].enabled ? 'auto' : 'none';
                });

                // Update status display
                if (!ledStates[ledId].enabled) {
                    led.indicator.className = 'status-indicator off';
                    led.statusText.textContent = 'Status: Disabled';
                    // Clear any existing intervals
                    if (led.statusInterval) {
                        clearInterval(led.statusInterval);
                    }
                } else {
                    updateLEDStatus(ledId);
                    // Restart status updates
                    led.statusInterval = setInterval(() => updateLEDStatus(ledId), 2000);
                }

                // Send state to server
                fetch(`/api/led${ledId}/system/state`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enabled: ledStates[ledId].enabled })
                });
            };

            // timer duration change handler
            led.timerDuration.onchange = () => {
                if (led.timerDuration.value === "0") {
                    led.timerSwitch.style.display = 'none';
                } else {
                    led.timerSwitch.style.display = 'flex';
                }
            };

            // Initialize timer switch visibility
            led.timerSwitch.style.display = led.timerDuration.value === "0" ? 'none' : 'flex';

            // Start status updates with interval reference
            led.statusInterval = setInterval(() => updateLEDStatus(ledId), 2000);
            updateLEDStatus(ledId);

            // Initial update if starting in manual mode
            if (led.modes[0].checked) {
                updateLEDStatus(ledId);
            }
        }

        // Update LED status
        function updateLEDStatus(ledId) {
            const indicator = document.querySelector(`#led${ledId} .status-indicator`);
            const statusText = document.querySelector(`#liveStatus_${ledId}`);
            const toggle = document.querySelector(`#ledToggle_${ledId}`);
            const disableToggle = document.querySelector(`#disableToggle_${ledId}`);
            const controls = document.querySelectorAll(`#led${ledId} .control-panel, #led${ledId} .mode-selector`);

            fetch(`/api/led${ledId}/system/state?check=${Date.now()}`, { cache: 'no-store' })
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.json();
                })
                .then(systemState => {
                    ledStates[ledId].enabled = systemState.enabled;
                    disableToggle.checked = !systemState.enabled;
                    controls.forEach(panel => {
                        panel.style.opacity = systemState.enabled ? '1' : '0.5';
                        panel.style.pointerEvents = systemState.enabled ? 'auto' : 'none';
                    });

                    if (!systemState.enabled) {
                        indicator.className = 'status-indicator off';
                        statusText.textContent = 'Status: Disabled';
                        return null;
                    }
                    return fetch(`/api/led${ledId}/status?check=${Date.now()}`, { cache: 'no-store' })
                        .then(response => {
                            if (!response.ok) throw new Error('Network response was not ok');
                            return response.text();
                        });
                })
                .then(state => {
                    if (state === null) return;
                    if (state !== 'ON' && state !== 'OFF') throw new Error('Invalid state received');
                    indicator.className = `status-indicator ${state.toLowerCase()}`;
                    statusText.textContent = `Status: ${state}`;
                    toggle.checked = (state === 'ON');
                })
                .catch(error => {
                    console.error('Error:', error);
                    indicator.className = 'status-indicator off';
                    statusText.textContent = 'Status: Error';
                    toggle.checked = false;  // Default to OFF on error
                });

            fetch(`/api/led${ledId}/temperature?check=${Date.now()}`, { cache: 'no-store' })
                .then(response => response.json())
                .then(settings => {
                    const temperature = typeof settings.temperature === 'number' ? settings.temperature : NaN;
                    if (Number.isFinite(temperature))
                        document.querySelector(`#temperatureValue_${ledId}`).textContent = `Temperature: ${temperature.toFixed(1)}°C`;
                })
                .catch(() => { });
        }

        // Connection status check
        let connectionCheckId = 0;
        function checkConnection() {
            const conn = document.getElementById('connectionStatus');
            const checkId = ++connectionCheckId;
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 1500);

            fetch(`/api/status?check=${Date.now()}`, {
                cache: 'no-store',
                signal: controller.signal
            })
                .then(response => {
                    if (!response.ok) throw new Error('Status request failed');
                    return response.text();
                })
                .then(status => {
                    if (checkId !== connectionCheckId) return;
                    if (status.trim() === 'true') {
                        conn.className = 'connection-status online';
                        conn.querySelector('span:last-child').textContent = 'Online';
                    }
                    else {
                        conn.className = 'connection-status offline';
                        conn.querySelector('span:last-child').textContent = 'Offline';
                    }
                })
                .catch(() => {
                    if (checkId !== connectionCheckId) return;
                    conn.className = 'connection-status offline';
                    conn.querySelector('span:last-child').textContent = 'Offline';
                })
                .finally(() => clearTimeout(timeoutId));
        }

        function fetchVersion() {
            fetch('/api/version')
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.text();
                })
                .then(version => {
                    document.getElementById('versionInfo').textContent = version;
                })
                .catch(error => {
                    console.error('Error fetching version:', error);
                    document.getElementById('versionInfo').textContent = 'error';
                });
        }

        async function fetchRtcData() {
            try {
                const response = await fetch(`/api/rtctime?check=${Date.now()}`, { cache: 'no-store' });
                if (!response.ok) throw new Error('RTC request failed');
                const data = (await response.text()).trim();
                return data ? `${data}\u00B0C` : 'RTC Error';
            } catch (error) {
                return 'RTC Error';
            }
        }

        function fetchError() {
            fetch('/api/error')
                .then(response => response.json())
                .then(result => {
                    if (result.error) alert(`Message: ${result.error}`);
                })
                .catch(error => console.error('Error fetching device message:', error));
        }

        // Replace existing initialization code at the bottom with:
        function initializeApp() {
            fetchRelayCount().then(() => Promise.all([
                fetchLEDStates(),
                fetchLEDNames(),
                fetchScheduleTimes(),
                fetchTemperatureSensors()
            ])).then(() => {
                // After states are loaded, initialize modes and timers
                initModesFromServer();
                relayIds.forEach(ledId => {
                    setupLED(ledId);
                    checkTimerState(ledId); // Check timer state for each LED
                });
            });

            // Setup periodic checks
            setInterval(checkConnection, 3000);
            setInterval(fetchError, 3000);
            setInterval(() => fetchRtcData().then(data => {
                document.getElementById('rtcDisplay').textContent = data;
            }), 15000);
            checkConnection();
            fetchError();
            fetchRtcData().then(data => {
                document.getElementById('rtcDisplay').textContent = data;
            });
            fetchVersion();
        }

        // Start the app
        initializeApp();
    </script>
</body>
