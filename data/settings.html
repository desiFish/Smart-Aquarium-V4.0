<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Aquarium Settings</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="/favicon.jpg">
    <meta name="theme-color" content="#33afff">
    <style>
        body {
            background: #121212;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px 20px 40px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .page-header {
            background: #1e1e1e;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            margin-bottom: 1rem;
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
            text-align: center;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            padding: 0 60px;
            box-sizing: border-box;
        }

        .page-title {
            color: #2196F3;
            font-size: 2rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            flex: 1;
            text-align: center;
        }

        .connection-status {
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 5px;
            position: absolute;
            right: 0;
        }

        .connection-status.online {
            background: #1b5e20;
            color: #4CAF50;
        }

        .connection-status.offline {
            background: #b71c1c;
            color: #ff5252;
        }

        .connection-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .connection-status.online .connection-dot {
            background: #4CAF50;
            box-shadow: 0 0 8px #4CAF50;
        }

        .connection-status.offline .connection-dot {
            background: #ff5252;
            box-shadow: 0 0 8px #ff5252;
        }

        .version-footer {
            margin-top: auto;
            width: 100%;
            font-size: 0.7rem;
            color: #666;
            text-align: center;
            background: #121212;
            padding: 8px 0;
            border-top: 1px solid #252525;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .copyright {
            font-size: 0.65rem;
            color: #555;
        }

        .navbar {
            width: 100%;
            max-width: 600px;
            margin-bottom: 1rem;
            display: flex;
            justify-content: center;
            padding: 8px;
            background: #1e1e1e;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
        }

        .rtc-display {
            color: #4CAF50;
            font-size: 1rem;
            text-align: center;
            min-height: 1.2em;
        }

        .time-settings-container {
            width: 100%;
            max-width: 900px;
            box-sizing: border-box;
            background: #1e1e1e;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
        }

        .time-settings-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .time-setting label {
            display: block;
            color: #bdbdbd;
            margin-bottom: 6px;
        }

        .time-setting input,
        .time-setting select {
            width: 100%;
            box-sizing: border-box;
        }

        .time-offset {
            color: #4CAF50;
            text-align: center;
            margin-top: 14px;
        }

        @media (max-width: 600px) {
            .time-settings-grid {
                grid-template-columns: 1fr;
            }
        }

        .nav-btn {
            background: #252525;
            color: #2196F3;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .nav-btn:hover {
            background: #2196F3;
            color: white;
            transform: translateY(-1px);
        }

        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                gap: 1rem;
                padding: 0;
            }

            .connection-status {
                position: static;
                margin-top: 0.5rem;
            }

            .page-title {
                margin-bottom: 0.5rem;
            }
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 900px;
        }

        .settings-container {
            background: #1e1e1e;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            width: 100%;
            box-sizing: border-box;
        }

        .settings-title {
            color: #2196F3;
            font-size: 1.2rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .name-input {
            background: #252525;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 4px;
            width: 100%;
            margin: 5px 0;
        }

        .btn-set {
            background: #2196F3;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }

        .btn-set:hover {
            background: #1976D2;
        }

        .btn-reset {
            background: #b71c1c;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-reset:hover {
            background: #d32f2f;
        }

        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="page-header">
        <div class="header">
            <h2 class="page-title">Settings</h2>
            <div id="connectionStatus" class="connection-status offline" role="status" aria-live="polite">
                <span class="connection-dot"></span>
                <span>Offline</span>
            </div>
        </div>
    </div>

    <div id="rtcDisplay" class="rtc-display" role="status" aria-live="polite">RTC Error</div>

    <nav class="navbar">
        <button class="nav-btn" onclick="window.location.href='index.html'">Back</button>
        <button class="nav-btn" style="margin-left: 10px;" onclick="updateTime()">Update Time</button>
        <button class="nav-btn" style="margin-left: 10px;" onclick="rebootDevice()">Reboot</button>
        <button class="btn-reset" style="margin: 0 0 0 10px;" onclick="resetAll()">Reset All</button>
    </nav>

    <section class="time-settings-container">
        <h3 class="settings-title">TIME AND NTP SETTINGS</h3>
        <div class="time-settings-grid">
            <div class="time-setting">
                <label for="timezoneInput">Timezone</label>
                <input id="timezoneInput" type="text" placeholder="UTC+05:30" autocomplete="off">
            </div>
            <div class="time-setting">
                <label for="ntpServerSelect">NTP pool server</label>
                <select id="ntpServerSelect"></select>
                <input id="customNtpServer" class="name-input" type="text" placeholder="Custom NTP server" hidden>
            </div>
        </div>
        <div id="timeOffset" class="time-offset">Offset: --</div>
        <button id="saveTimeSettings" class="btn-set">Save Time Settings</button>
    </section>

    <div id="relayNameGrid" class="grid-container">
    </div>

    <footer class="version-footer">
        <span id="versionInfo">Checking version...</span>
        <span class="copyright">&copy; 2026 <a href="https://github.com/desiFish/Smart-Aquarium-V4.0">desiFish</a>. All
            rights reserved.</span>
    </footer>

    <script>
        let relayIds = [];
        let timeSettingsDirty = false;

        function generateRelayNameCards(relayCount) {
            const grid = document.getElementById('relayNameGrid');
            grid.innerHTML = '';
            relayIds = Array.from({ length: relayCount }, (_, index) => index + 1);
            relayIds.forEach(ledId => {
                grid.insertAdjacentHTML('beforeend', `
                    <div class="settings-container">
                        <h3 class="settings-title">RELAY ${ledId} Name</h3>
                        <label for="nameInput_${ledId}">Relay ${ledId} name</label>
                        <input type="text" id="nameInput_${ledId}" class="name-input" placeholder="Loading current name...">
                        <button class="btn-set" onclick="setLEDName(${ledId})">Set Name</button>
                    </div>`);
            });
        }

        function fetchRelayCount() {
            return fetch(`/api/relay-count?check=${Date.now()}`, { cache: 'no-store' })
                .then(response => {
                    if (!response.ok) throw new Error('Relay count request failed');
                    return response.text();
                })
                .then(value => {
                    const relayCount = Number(value);
                    if (!Number.isInteger(relayCount) || relayCount < 1) throw new Error('Invalid relay count');
                    if (relayIds.length !== relayCount)
                        generateRelayNameCards(relayCount);
                })
                .catch(error => {
                    console.error('Error fetching relay count:', error);
                    if (relayIds.length !== 4)
                        generateRelayNameCards(4);
                });
        }

        function updateCustomNtpVisibility() {
            document.getElementById('customNtpServer').hidden = document.getElementById('ntpServerSelect').value !== 'custom';
        }

        function formatOffset(offset) {
            const sign = offset < 0 ? '-' : '+';
            const absolute = Math.abs(offset);
            return `UTC${sign}${String(Math.floor(absolute / 3600)).padStart(2, '0')}:${String((absolute % 3600) / 60).padStart(2, '0')}`;
        }

        function calculateTimezoneOffset(timezone) {
            const value = timezone.trim().toUpperCase();
            if (value === 'UTC' || value === 'GMT') return 0;
            const match = value.match(/^(?:UTC|GMT)?([+-])(\d{1,2})(?::?(\d{2}))?$/);
            if (!match) return 0;
            const hours = Number(match[2]);
            const minutes = Number(match[3] || 0);
            if (hours > 14 || minutes > 59 || (hours === 14 && minutes > 0)) return 0;
            return (match[1] === '-' ? -1 : 1) * (hours * 3600 + minutes * 60);
        }

        function isValidTimezone(timezone) {
            const value = timezone.trim().toUpperCase();
            if (value === 'UTC' || value === 'GMT') return true;
            const match = value.match(/^(?:UTC|GMT)?([+-])(\d{1,2})(?::?(\d{2}))?$/);
            if (!match) return false;
            const hours = Number(match[2]);
            const minutes = Number(match[3] || 0);
            return hours <= 14 && minutes <= 59 && !(hours === 14 && minutes > 0);
        }

        function fetchTimeSettings() {
            return fetch(`/api/time-settings?check=${Date.now()}`, { cache: 'no-store' })
                .then(response => {
                    if (!response.ok) throw new Error('Time settings request failed');
                    return response.json();
                })
                .then(settings => {
                    if (timeSettingsDirty) return settings;
                    document.getElementById('timezoneInput').value = settings.timezone || 'UTC';
                    document.getElementById('timeOffset').textContent = `Offset: ${formatOffset(settings.offset || 0)}`;
                    const select = document.getElementById('ntpServerSelect');
                    select.innerHTML = '';
                    (settings.ntpServers || []).forEach(server => {
                        const option = document.createElement('option');
                        option.value = server;
                        option.textContent = server === 'custom' ? 'Custom server' : server;
                        select.appendChild(option);
                    });
                    select.value = settings.ntpServer || 'pool.ntp.org';
                    document.getElementById('customNtpServer').value = settings.customServer || '';
                    updateCustomNtpVisibility();
                });
        }

        function saveTimeSettings() {
            const timezone = document.getElementById('timezoneInput').value.trim();
            const ntpServer = document.getElementById('ntpServerSelect').value;
            const customServer = document.getElementById('customNtpServer').value.trim();
            const offset = calculateTimezoneOffset(timezone);
            if (!isValidTimezone(timezone) || (ntpServer === 'custom' && !customServer)) {
                alert('Enter a valid timezone such as UTC+05:30 and a valid NTP server');
                return;
            }
            fetch('/api/time-settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ timezone, offset, ntpServer, customServer })
            })
                .then(response => response.json().then(result => ({ ok: response.ok, result })))
                .then(({ ok, result }) => {
                    if (!ok) throw new Error(result.error || 'Time settings update failed');
                    document.getElementById('timeOffset').textContent = `Offset: ${formatOffset(result.offset)}`;
                    timeSettingsDirty = false;
                    alert(result.message);
                })
                .catch(error => alert(error.message));
        }

        // Connection status check
        let connectionCheckId = 0;
        function checkConnection() {
            const conn = document.getElementById('connectionStatus');
            const checkId = ++connectionCheckId;
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 1500);

            fetch(`/api/status?check=${Date.now()}`, {
                cache: 'no-store',
                signal: controller.signal
            })
                .then(response => {
                    if (!response.ok) throw new Error('Status request failed');
                    return response.text();
                })
                .then(status => {
                    if (checkId !== connectionCheckId) return;
                    if (status.trim() === 'true') {
                        conn.className = 'connection-status online';
                        conn.querySelector('span:last-child').textContent = 'Online';
                    }
                    else {
                        conn.className = 'connection-status offline';
                        conn.querySelector('span:last-child').textContent = 'Offline';
                    }
                })
                .catch(() => {
                    if (checkId !== connectionCheckId) return;
                    conn.className = 'connection-status offline';
                    conn.querySelector('span:last-child').textContent = 'Offline';
                })
                .finally(() => clearTimeout(timeoutId));
        }

        function fetchVersion() {
            fetch('/api/version')
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.text();
                })
                .then(version => {
                    document.getElementById('versionInfo').textContent = version;
                })
                .catch(error => {
                    console.error('Error fetching version:', error);
                    document.getElementById('versionInfo').textContent = 'error';
                });
        }

        async function fetchRtcData() {
            try {
                const response = await fetch(`/api/rtctime?check=${Date.now()}`, { cache: 'no-store' });
                if (!response.ok) throw new Error('RTC request failed');
                const data = (await response.text()).trim();
                return data ? `${data}\u00B0C` : 'RTC Error';
            } catch (error) {
                return 'RTC Error';
            }
        }

        function fetchError() {
            fetch('/api/error')
                .then(response => response.json())
                .then(result => {
                    if (result.error) alert(`Message: ${result.error}`);
                })
                .catch(error => console.error('Error fetching device message:', error));
        }

        function fetchLEDNames() {
            relayIds.forEach(ledId => {
                fetch(`/api/led${ledId}/name`)
                    .then(response => {
                        if (!response.ok) throw new Error('Network response was not ok');
                        return response.text();
                    })
                    .then(name => {
                        const input = document.getElementById(`nameInput_${ledId}`);
                        input.placeholder = `Current name: ${name}`;
                    })
                    .catch(error => {
                        console.error('Error fetching LED name:', error);
                        const input = document.getElementById(`nameInput_${ledId}`);
                        input.placeholder = 'Error loading name';
                    });
            });
        }

        function setLEDName(ledId) {
            const input = document.getElementById(`nameInput_${ledId}`);
            const newName = input.value.trim();

            if (!newName) {
                alert('Please enter a name');
                return;
            }

            fetch(`/api/led${ledId}/name`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: newName })
            })
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    input.value = '';
                    input.placeholder = `Current name: ${newName}`;
                    alert('Name updated successfully');
                })
                .catch(error => {
                    console.error('Error setting LED name:', error);
                    alert('Failed to update name');
                });
        }

        // Update time function
        function updateTime() {
            fetch('/api/time/update', {
                method: 'POST'
            })
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    alert('Time updated requested successfully');
                })
                .catch(error => {
                    console.error('Error updating time:', error);
                    alert('Failed to update time');
                });
        }

        document.getElementById('ntpServerSelect').addEventListener('change', () => {
            timeSettingsDirty = true;
            updateCustomNtpVisibility();
        });
        document.getElementById('timezoneInput').addEventListener('input', () => {
            timeSettingsDirty = true;
        });
        document.getElementById('customNtpServer').addEventListener('input', () => {
            timeSettingsDirty = true;
        });
        document.getElementById('saveTimeSettings').addEventListener('click', saveTimeSettings);

        function resetAll() {
            if (!confirm('Reset all relay values and WiFi settings to defaults?')) return;

            fetch('/api/reset', { method: 'POST' })
                .then(response => {
                    if (!response.ok) throw new Error('Reset request failed');
                    return response.json();
                })
                .then(result => alert(result.info || 'Reset scheduled. Device will reboot in 5 seconds.'))
                .catch(error => {
                    console.error('Error resetting device:', error);
                    alert('Failed to reset device');
                });
        }

        function rebootDevice() {
            if (!confirm('Reboot the device now?')) return;
            fetch('/api/reboot', { method: 'POST' })
                .then(response => {
                    if (!response.ok) throw new Error('Reboot request failed');
                    return response.json();
                })
                .then(result => alert(result.info || 'Device will reboot in 3 seconds.'))
                .catch(error => {
                    console.error('Error rebooting device:', error);
                    alert('Failed to reboot device');
                });
        }

        // Initialize
        fetchRelayCount().then(() => {
            fetchTimeSettings();
            fetchVersion();
            fetchError();
            setInterval(() => fetchRtcData().then(data => {
                document.getElementById('rtcDisplay').textContent = data;
            }), 15000);
            setInterval(checkConnection, 3000);
            setInterval(fetchError, 3000);
            checkConnection();
            fetchRtcData().then(data => {
                document.getElementById('rtcDisplay').textContent = data;
            });
            fetchLEDNames();
        });

        setInterval(() => {
            fetchRelayCount();
            fetchTimeSettings();
            fetchVersion();
            fetchLEDNames();
        }, 10000);
    </script>
</body>

</html>
