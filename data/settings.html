<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Aquarium Settings</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="/favicon.jpg">
    <meta name="theme-color" content="#33afff">
    <style>
        body {
            background: #121212;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px 20px 40px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .page-header {
            background: #1e1e1e;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            margin-bottom: 1rem;
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
            text-align: center;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            padding: 0 60px;
            box-sizing: border-box;
        }

        .page-title {
            color: #2196F3;
            font-size: 2rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            flex: 1;
            text-align: center;
        }

        .connection-status {
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 5px;
            position: absolute;
            right: 0;
        }

        .connection-status.online {
            background: #1b5e20;
            color: #4CAF50;
        }

        .connection-status.offline {
            background: #b71c1c;
            color: #ff5252;
        }

        .connection-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .connection-status.online .connection-dot {
            background: #4CAF50;
            box-shadow: 0 0 8px #4CAF50;
        }

        .connection-status.offline .connection-dot {
            background: #ff5252;
            box-shadow: 0 0 8px #ff5252;
        }

        .version-footer {
            margin-top: auto;
            width: 100%;
            padding: 14px 0 4px;
            color: #7d8791;
            text-align: center;
            border-top: 1px solid #303840;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 0.72rem;
        }

        #versionInfo {
            padding: 4px 9px;
            border: 1px solid #3b4650;
            border-radius: 999px;
            color: #b8c3cc;
            font-size: 0.68rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .copyright {
            color: #7d8791;
        }

        .copyright a {
            color: #9ed8ff;
            text-decoration: none;
        }

        .copyright a:hover {
            color: #2196F3;
            text-decoration: underline;
        }

        .navbar {
            width: 100%;
            max-width: 600px;
            margin-bottom: 1rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            padding: 8px;
            background: #1e1e1e;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
        }

        .rtc-display {
            color: #4CAF50;
            font-size: 1rem;
            text-align: center;
            min-height: 1.2em;
        }

        .time-settings-container,
        .config-container,
        .settings-container {
            width: 100%;
            box-sizing: border-box;
            background: #1e1e1e;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
        }

        .time-settings-container,
        .config-container {
            max-width: 900px;
        }

        .time-settings-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .time-setting label {
            display: block;
            color: #bdbdbd;
            margin-bottom: 6px;
        }

        .time-setting input,
        .time-setting select {
            width: 100%;
            box-sizing: border-box;
        }

        .time-offset {
            color: #4CAF50;
            text-align: center;
            margin-top: 14px;
        }

        .config-row {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            margin-top: 12px;
            color: #bdbdbd;
        }

        .config-row input {
            width: 18px;
            height: 18px;
        }

        @media (max-width: 600px) {
            .time-settings-grid {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                gap: 1rem;
                padding: 0;
            }

            .navbar {
                flex-direction: column;
                align-items: stretch;
            }

            .nav-btn,
            .btn-reset {
                width: 100%;
            }

            .connection-status {
                position: static;
                margin-top: 0.5rem;
            }

            .page-title {
                margin-bottom: 0.5rem;
            }
        }

        .nav-btn,
        .btn-reset {
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .nav-btn {
            background: #252525;
            color: #2196F3;
        }

        .nav-btn:hover {
            background: #2196F3;
            color: white;
            transform: translateY(-1px);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 900px;
        }

        .settings-title {
            color: #2196F3;
            font-size: 1.2rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .name-input {
            background: #252525;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 4px;
            width: 100%;
            margin: 5px 0;
        }

        .btn-set {
            background: #2196F3;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }

        .btn-set:hover {
            background: #1976D2;
        }

        .firmware-update {
            display: block;
            margin: 16px auto 0;
        }

        .settings-data-actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            width: 100%;
            max-width: 900px;
        }

        .settings-data-actions .btn-set {
            margin-top: 0;
        }

        .operation-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(18, 18, 18, 0.94);
        }

        .operation-overlay.active {
            display: flex;
        }

        .operation-dialog {
            width: min(420px, 100%);
            padding: 24px;
            background: #1e1e1e;
            border: 1px solid #3b4650;
            border-radius: 8px;
            text-align: center;
        }

        .operation-dialog h3 {
            margin: 0 0 16px;
            color: #2196F3;
        }

        .operation-progress {
            height: 10px;
            overflow: hidden;
            margin-top: 16px;
            background: #333;
            border-radius: 5px;
        }

        .operation-progress-bar {
            width: 0;
            height: 100%;
            background: #2196F3;
            transition: width 0.25s ease;
        }

        .btn-reset {
            background: #b71c1c;
            margin-top: 0;
        }

        .btn-reset:hover {
            background: #d32f2f;
            transform: translateY(-1px);
        }

        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div id="operationOverlay" class="operation-overlay" role="alertdialog" aria-modal="true" aria-live="polite">
        <div class="operation-dialog">
            <h3 id="operationTitle">Please wait</h3>
            <div id="operationMessage">Working...</div>
            <div class="operation-progress" aria-hidden="true">
                <div id="operationProgressBar" class="operation-progress-bar"></div>
            </div>
        </div>
    </div>

    <div class="page-header">
        <div class="header">
            <h2 class="page-title">Settings</h2>
            <div id="connectionStatus" class="connection-status offline" role="status" aria-live="polite">
                <span class="connection-dot"></span>
                <span>Offline</span>
            </div>
        </div>
    </div>

    <div id="rtcDisplay" class="rtc-display" role="status" aria-live="polite">RTC Error</div>

    <nav class="navbar">
        <button class="nav-btn" onclick="window.location.href='index.html'">Back</button>
        <button class="nav-btn" onclick="updateTime()">Update Time</button>
        <button class="nav-btn" onclick="rebootDevice()">Reboot</button>
        <button class="btn-reset" onclick="resetAll()">Reset All</button>
    </nav>

    <section class="time-settings-container">
        <h3 class="settings-title">TIME AND NTP SETTINGS</h3>
        <div class="time-settings-grid">
            <div class="time-setting">
                <label for="timezoneInput">Timezone offset</label>
                <input id="timezoneInput" type="text" placeholder="+5:30" autocomplete="off">
            </div>
            <div class="time-setting">
                <label for="ntpServerSelect">NTP pool server</label>
                <select id="ntpServerSelect"></select>
                <input id="customNtpServer" class="name-input" type="text" placeholder="Custom NTP server" hidden>
            </div>
        </div>
        <div id="timeOffset" class="time-offset">Offset: --</div>
        <button id="saveTimeSettings" class="btn-set">Save Time Settings</button>
    </section>

    <div id="relayNameGrid" class="grid-container">
    </div>

    <section class="config-container">
        <h3 class="settings-title">CONFIGURATIONS</h3>
        <label class="config-row" for="useTemperatureSensors">
            <input id="useTemperatureSensors" type="checkbox">
            <span>Use temperature sensors</span>
        </label>
    </section>

    <div class="settings-data-actions">
        <button class="btn-set" type="button" onclick="window.location.href='/update'">Firmware Update</button>
        <button id="backupSettings" class="btn-set" type="button">Backup</button>
        <button id="restoreSettings" class="btn-set" type="button">Restore</button>
        <input id="restoreFile" type="file" accept="application/json,.json" hidden>
    </div>

    <footer class="version-footer">
        <span id="versionInfo">Checking version...</span>
        <span class="copyright">&copy; 2025 <a href="https://github.com/desiFish/Smart-Aquarium-V4.0">desiFish</a> |
            Made in India 🇮🇳 | ॐ नमो नारायणाय</span>
    </footer>

    <script>
        let relayIds = [];
        let timeSettingsDirty = false;
        const ACTION_DEBOUNCE_MS = 1000;
        let actionDebounceUntil = 0;

        function applyActionDebounce(buttons) {
            const now = Date.now();
            if (now < actionDebounceUntil) {
                return false;
            }

            actionDebounceUntil = now + ACTION_DEBOUNCE_MS;
            buttons.forEach(button => {
                button.disabled = true;
                button.style.opacity = '0.6';
            });

            setTimeout(() => {
                buttons.forEach(button => {
                    button.disabled = false;
                    button.style.opacity = '';
                });
            }, ACTION_DEBOUNCE_MS);

            return true;
        }

        function generateRelayNameCards(relayCount) {
            const grid = document.getElementById('relayNameGrid');
            grid.innerHTML = '';
            relayIds = Array.from({ length: relayCount }, (_, index) => index + 1);
            relayIds.forEach(ledId => {
                grid.insertAdjacentHTML('beforeend', `
                    <div class="settings-container">
                        <h3 class="settings-title">RELAY ${ledId} Name</h3>
                        <label for="nameInput_${ledId}">Relay ${ledId} name</label>
                        <input type="text" id="nameInput_${ledId}" class="name-input" placeholder="Loading current name...">
                        <button class="btn-set" onclick="setLEDName(${ledId})">Set Name</button>
                    </div>`);
            });
        }

        function fetchRelayCount() {
            return fetch(`/api/relay-count?check=${Date.now()}`, { cache: 'no-store' })
                .then(response => {
                    if (!response.ok) throw new Error('Relay count request failed');
                    return response.text();
                })
                .then(value => {
                    const relayCount = Number(value);
                    if (!Number.isInteger(relayCount) || relayCount < 1) throw new Error('Invalid relay count');
                    if (relayIds.length !== relayCount)
                        generateRelayNameCards(relayCount);
                })
                .catch(error => {
                    console.error('Error fetching relay count:', error);
                    if (relayIds.length !== 4)
                        generateRelayNameCards(4);
                });
        }

        function updateCustomNtpVisibility() {
            document.getElementById('customNtpServer').hidden = document.getElementById('ntpServerSelect').value !== 'custom';
        }

        function formatOffset(offset) {
            const sign = offset < 0 ? '-' : '+';
            const absolute = Math.abs(offset);
            return `${sign}${Math.floor(absolute / 3600)}:${String((absolute % 3600) / 60).padStart(2, '0')}`;
        }

        function calculateOffset(offsetText) {
            const match = offsetText.trim().match(/^([+-])(\d{1,2})(?::?(\d{2}))?$/);
            if (!match) return 0;
            const hours = Number(match[2]);
            const minutes = Number(match[3] || 0);
            if (hours > 14 || minutes > 59 || (hours === 14 && minutes > 0)) return 0;
            return (match[1] === '-' ? -1 : 1) * (hours * 3600 + minutes * 60);
        }

        function isValidOffset(offsetText) {
            const match = offsetText.trim().match(/^([+-])(\d{1,2})(?::?(\d{2}))?$/);
            if (!match) return false;
            const hours = Number(match[2]);
            const minutes = Number(match[3] || 0);
            return hours <= 14 && minutes <= 59 && !(hours === 14 && minutes > 0);
        }

        function fetchTimeSettings() {
            return fetch(`/api/time-settings?check=${Date.now()}`, { cache: 'no-store' })
                .then(response => {
                    if (!response.ok) throw new Error('Time settings request failed');
                    return response.json();
                })
                .then(settings => {
                    if (timeSettingsDirty) return;
                    document.getElementById('timezoneInput').value = formatOffset(settings.offset || 0);
                    document.getElementById('timeOffset').textContent = `Offset: ${formatOffset(settings.offset || 0)}`;
                    const select = document.getElementById('ntpServerSelect');
                    select.innerHTML = '';
                    (settings.ntpServers || []).forEach(server => {
                        const option = document.createElement('option');
                        option.value = server;
                        option.textContent = server === 'custom' ? 'Custom server' : server;
                        select.appendChild(option);
                    });
                    select.value = settings.ntpServer || 'pool.ntp.org';
                    document.getElementById('customNtpServer').value = settings.customServer || '';
                    updateCustomNtpVisibility();
                });
        }

        function saveTimeSettings() {
            const saveButton = document.getElementById('saveTimeSettings');
            const offsetText = document.getElementById('timezoneInput').value.trim();
            const ntpServer = document.getElementById('ntpServerSelect').value;
            const customServer = document.getElementById('customNtpServer').value.trim();
            const offset = calculateOffset(offsetText);

            if (!isValidOffset(offsetText) || (ntpServer === 'custom' && !customServer)) {
                alert('Enter a valid timezone offset such as +5:30 and a valid NTP server');
                return;
            }

            const targetServer = ntpServer === 'custom' ? customServer : ntpServer;
            if (!confirm(`Save these time settings?\n\nTimezone offset: ${formatOffset(offset)}\nNTP server: ${targetServer}`)) {
                return;
            }

            if (!applyActionDebounce([saveButton])) return;

            fetch('/api/time-settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ offset, ntpServer, customServer })
            })
                .then(response => response.json().then(result => ({ ok: response.ok, result })))
                .then(({ ok, result }) => {
                    if (!ok) throw new Error(result.error || 'Time settings update failed');
                    document.getElementById('timeOffset').textContent = `Offset: ${formatOffset(result.offset)}`;
                    timeSettingsDirty = false;
                    alert(result.message);
                })
                .catch(error => alert(error.message));
        }

        // Connection status check
        let connectionCheckId = 0;
        function checkConnection() {
            const conn = document.getElementById('connectionStatus');
            const statusText = conn.querySelector('span:last-child');
            const checkId = ++connectionCheckId;
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 1500);

            fetch(`/api/status?check=${Date.now()}`, {
                cache: 'no-store',
                signal: controller.signal
            })
                .then(response => {
                    if (!response.ok) throw new Error('Status request failed');
                    return response.text();
                })
                .then(status => {
                    if (checkId !== connectionCheckId) return;
                    if (status.trim() === 'true') {
                        conn.className = 'connection-status online';
                        statusText.textContent = 'Online';
                    }
                    else {
                        conn.className = 'connection-status offline';
                        statusText.textContent = 'Offline';
                    }
                })
                .catch(() => {
                    if (checkId !== connectionCheckId) return;
                    conn.className = 'connection-status offline';
                    statusText.textContent = 'Offline';
                })
                .finally(() => clearTimeout(timeoutId));
        }

        function fetchVersion() {
            fetch('/api/version')
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.text();
                })
                .then(version => {
                    document.getElementById('versionInfo').textContent = version;
                })
                .catch(error => {
                    console.error('Error fetching version:', error);
                    document.getElementById('versionInfo').textContent = 'error';
                });
        }

        function fetchSystemConfig() {
            fetch('/api/system/config')
                .then(response => response.json())
                .then(config => {
                    document.getElementById('useTemperatureSensors').checked = config.useTempSensor !== false;
                })
                .catch(error => {
                    console.error('Error fetching system config:', error);
                    document.getElementById('useTemperatureSensors').checked = true;
                });
        }

        function saveSystemConfig() {
            const toggle = document.getElementById('useTemperatureSensors');
            if (!applyActionDebounce([toggle])) return;

            const enabled = toggle.checked;
            fetch('/api/system/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ useTempSensor: enabled })
            })
                .then(response => response.json())
                .then(result => {
                    if (!result.success) throw new Error('Config update failed');
                    if (enabled) {
                        alert('Temperature sensors enabled');
                    } else {
                        alert('Temperature sensors disabled');
                    }
                    window.location.reload();
                })
                .catch(error => {
                    console.error('Error saving system config:', error);
                    alert('Failed to save configuration');
                });
        }

        document.getElementById('useTemperatureSensors').addEventListener('change', saveSystemConfig);

        async function fetchRtcData() {
            try {
                const response = await fetch(`/api/rtctime?check=${Date.now()}`, { cache: 'no-store' });
                if (!response.ok) throw new Error('RTC request failed');
                const data = (await response.text()).trim();
                return data ? `${data}\u00B0C` : 'RTC Error';
            } catch (error) {
                return 'RTC Error';
            }
        }

        function fetchError() {
            fetch('/api/error')
                .then(response => response.json())
                .then(result => {
                    if (result.error) {
                        alert(`Message: ${result.error}`);
                        fetch('/api/error/ack', { method: 'POST' }).catch(() => { });
                    }
                })
                .catch(error => console.error('Error fetching device message:', error));
        }

        function fetchLEDNames() {
            relayIds.forEach(ledId => {
                fetch(`/api/led${ledId}/name`)
                    .then(response => {
                        if (!response.ok) throw new Error('Network response was not ok');
                        return response.text();
                    })
                    .then(name => {
                        const input = document.getElementById(`nameInput_${ledId}`);
                        input.placeholder = `Current name: ${name}`;
                    })
                    .catch(error => {
                        console.error('Error fetching LED name:', error);
                        const input = document.getElementById(`nameInput_${ledId}`);
                        input.placeholder = 'Error loading name';
                    });
            });
        }

        function setLEDName(ledId) {
            const input = document.getElementById(`nameInput_${ledId}`);
            const button = input.parentElement.querySelector('.btn-set');
            const newName = input.value.trim();

            if (!newName) {
                alert('Please enter a name');
                return;
            }

            if (!applyActionDebounce([button])) return;

            fetch(`/api/led${ledId}/name`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: newName })
            })
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    input.value = '';
                    input.placeholder = `Current name: ${newName}`;
                    alert('Name updated successfully');
                })
                .catch(error => {
                    console.error('Error setting LED name:', error);
                    alert('Failed to update name');
                });
        }

        // Update time function
        function updateTime() {
            const button = document.querySelector('.nav-btn:nth-of-type(2)');
            if (!applyActionDebounce([button])) return;

            fetch('/api/time/update', {
                method: 'POST'
            })
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    alert('Time updated requested successfully');
                })
                .catch(error => {
                    console.error('Error updating time:', error);
                    alert('Failed to update time');
                });
        }

        document.getElementById('ntpServerSelect').addEventListener('change', () => {
            timeSettingsDirty = true;
            updateCustomNtpVisibility();
        });
        document.getElementById('timezoneInput').addEventListener('input', () => {
            timeSettingsDirty = true;
        });
        document.getElementById('customNtpServer').addEventListener('input', () => {
            timeSettingsDirty = true;
        });
        document.getElementById('saveTimeSettings').addEventListener('click', saveTimeSettings);

        function resetAll() {
            const button = document.querySelector('.btn-reset');
            if (!confirm('Reset all relay values and WiFi settings to defaults?')) return;
            if (!applyActionDebounce([button])) return;

            fetch('/api/reset', { method: 'POST' })
                .then(response => {
                    if (!response.ok) throw new Error('Reset request failed');
                    return response.json();
                })
                .then(result => alert(result.info || 'Reset scheduled. Device will reboot in 5 seconds.'))
                .catch(error => {
                    console.error('Error resetting device:', error);
                    alert('Failed to reset device');
                });
        }

        function rebootDevice() {
            const button = document.querySelectorAll('.nav-btn')[2];
            if (!confirm('Reboot the device now?')) return;
            if (!applyActionDebounce([button])) return;
            fetch('/api/reboot', { method: 'POST' })
                .then(response => {
                    if (!response.ok) throw new Error('Reboot request failed');
                    return response.json();
                })
                .then(result => alert(result.info || 'Device will reboot in 3 seconds.'))
                .catch(error => {
                    console.error('Error rebooting device:', error);
                    alert('Failed to reboot device');
                });
        }

        async function getBackupValue(url, responseType = 'json') {
            const response = await fetch(url, { cache: 'no-store' });
            if (!response.ok) throw new Error(`Request failed: ${url}`);
            return responseType === 'text' ? response.text() : response.json();
        }

        async function postBackupValue(url, value) {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(value)
            });
            if (!response.ok) throw new Error(`Request failed: ${url}`);
        }

        function scheduleText(value) {
            const numericValue = Number(value) || 0;
            return `${String(Math.floor(numericValue / 100)).padStart(2, '0')}:${String(numericValue % 100).padStart(2, '0')}`;
        }

        function showOperation(title, message, progress = 0) {
            document.getElementById('operationTitle').textContent = title;
            document.getElementById('operationMessage').textContent = message;
            document.getElementById('operationProgressBar').style.width = `${Math.max(0, Math.min(100, progress))}%`;
            document.getElementById('operationOverlay').classList.add('active');
        }

        function hideOperation() {
            document.getElementById('operationOverlay').classList.remove('active');
        }

        async function collectRelayBackup(ledId) {
            const [name, system, schedule, temperature, timer, toggle] = await Promise.all([
                getBackupValue(`/api/led${ledId}/name`, 'text'),
                getBackupValue(`/api/led${ledId}/system/state`),
                getBackupValue(`/api/led${ledId}/schedule`),
                getBackupValue(`/api/led${ledId}/temperature`),
                getBackupValue(`/api/led${ledId}/timer/state`),
                getBackupValue(`/api/led${ledId}/toggle-mode/state`)
            ]);
            return { id: ledId, name, system, schedule, temperature, timer, toggle };
        }

        async function backupSettings() {
            const button = document.getElementById('backupSettings');
            if (!applyActionDebounce([button])) return;
            try {
                showOperation('Creating backup', 'Reading time and system settings...', 5);
                const timeSettings = await getBackupValue('/api/time-settings');
                const systemConfig = await getBackupValue('/api/system/config');
                const relays = [];
                for (let index = 0; index < relayIds.length; index++) {
                    showOperation('Creating backup', `Reading relay ${index + 1} of ${relayIds.length}...`, 10 + ((index + 1) / relayIds.length) * 80);
                    relays.push(await collectRelayBackup(relayIds[index]));
                }
                const backup = {
                    format: 'smart-aquarium-v4-settings',
                    version: 1,
                    createdAt: new Date().toISOString(),
                    timeSettings,
                    systemConfig,
                    relays
                };
                const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `smart-aquarium-settings-${new Date().toISOString().slice(0, 10)}.json`;
                link.click();
                URL.revokeObjectURL(link.href);
                showOperation('Backup complete', 'The settings file has been downloaded.', 100);
                setTimeout(hideOperation, 700);
            } catch (error) {
                console.error('Error creating backup:', error);
                hideOperation();
                alert('Failed to create backup');
            }
        }

        async function restoreRelaySettings(relay) {
            const ledId = Number(relay.id);
            if (!Number.isInteger(ledId) || !relay.system) throw new Error('Invalid relay backup');

            await postBackupValue(`/api/led${ledId}/name`, { name: String(relay.name || `Relay ${ledId}`) });
            await postBackupValue(`/api/led${ledId}/system/state`, { enabled: relay.system.enabled !== false });

            const mode = String(relay.system.mode || 'manual').toLowerCase();
            if (mode === 'temperature' && relay.temperature && relay.temperature.sensor && Number.isFinite(Number(relay.temperature.targetTemperature))) {
                await postBackupValue(`/api/led${ledId}/temperature`, {
                    sensor: relay.temperature.sensor,
                    targetTemperature: Number(relay.temperature.targetTemperature)
                });
            } else if (mode === 'auto' && relay.schedule) {
                await postBackupValue(`/api/led${ledId}/mode`, { mode: 'auto' });
                await postBackupValue(`/api/led${ledId}/schedule`, {
                    onTime: scheduleText(relay.schedule.onTime),
                    offTime: scheduleText(relay.schedule.offTime)
                });
            } else if (mode === 'timer' && relay.timer) {
                await postBackupValue(`/api/led${ledId}/mode`, { mode: 'timer' });
                if (relay.timer.active && Number(relay.timer.duration) > 0)
                    await postBackupValue(`/api/led${ledId}/timer`, { duration: Number(relay.timer.duration), start: true });
            } else if (mode === 'toggle' && relay.toggle) {
                await postBackupValue(`/api/led${ledId}/mode`, { mode: 'toggle' });
                await postBackupValue(`/api/led${ledId}/toggle-mode`, {
                    onMinutes: Number(relay.toggle.onMinutes) || 0,
                    offMinutes: Number(relay.toggle.offMinutes) || 0,
                    start: relay.toggle.active === true
                });
            } else {
                await postBackupValue(`/api/led${ledId}/mode`, { mode: 'manual' });
            }

            if (relay.system.enabled && ['manual', 'timer', 'toggle'].includes(mode)) {
                const currentState = await getBackupValue(`/api/led${ledId}/system/state`);
                if ((currentState.state === 'ON') !== (relay.system.state === 'ON'))
                    await postBackupValue(`/api/led${ledId}/toggle`, {});
            }
        }

        async function restoreSettings(file) {
            try {
                const backup = JSON.parse(await file.text());
                if (backup.format !== 'smart-aquarium-v4-settings' || !Array.isArray(backup.relays))
                    throw new Error('Unsupported backup file');
                if (!confirm('Restore saved relay and system settings?')) return;

                showOperation('Restoring backup', 'Preparing relay settings...', 0);
                for (let index = 0; index < backup.relays.length; index++) {
                    const relay = backup.relays[index];
                    showOperation('Restoring backup', `Restoring relay ${index + 1} of ${backup.relays.length}...`, (index / (backup.relays.length + 2)) * 100);
                    await restoreRelaySettings(relay);
                }

                if (backup.timeSettings) {
                    showOperation('Restoring backup', 'Restoring time and NTP settings...', (backup.relays.length / (backup.relays.length + 2)) * 100);
                    await postBackupValue('/api/time-settings', {
                        ntpServer: backup.timeSettings.ntpServer,
                        customServer: backup.timeSettings.customServer || '',
                        offset: Number(backup.timeSettings.offset)
                    });
                }
                if (backup.systemConfig && typeof backup.systemConfig.useTempSensor === 'boolean') {
                    showOperation('Restoring backup', 'Restoring system configuration...', ((backup.relays.length + 1) / (backup.relays.length + 2)) * 100);
                    await postBackupValue('/api/system/config', backup.systemConfig);
                }

                showOperation('Restore complete', 'Settings restored. Reloading...', 100);
                await new Promise(resolve => setTimeout(resolve, 700));
                alert('Settings restored successfully');
                window.location.reload();
            } catch (error) {
                console.error('Error restoring backup:', error);
                hideOperation();
                alert(`Failed to restore backup: ${error.message}`);
            }
        }

        document.getElementById('backupSettings').addEventListener('click', backupSettings);
        document.getElementById('restoreSettings').addEventListener('click', () => {
            document.getElementById('restoreFile').click();
        });
        document.getElementById('restoreFile').addEventListener('change', event => {
            if (event.target.files[0]) restoreSettings(event.target.files[0]);
            event.target.value = '';
        });

        // Initialize
        fetchSystemConfig();
        fetchRelayCount().then(() => {
            fetchTimeSettings();
            fetchVersion();
            fetchError();
            setInterval(() => fetchRtcData().then(data => {
                document.getElementById('rtcDisplay').textContent = data;
            }), 15000);
            setInterval(checkConnection, 3000);
            setInterval(fetchError, 3000);
            checkConnection();
            fetchRtcData().then(data => {
                document.getElementById('rtcDisplay').textContent = data;
            });
            fetchLEDNames();
        });

        setInterval(() => {
            fetchRelayCount();
            fetchTimeSettings();
            fetchSystemConfig();
            fetchVersion();
            fetchLEDNames();
        }, 10000);

    </script>
</body>

</html>
